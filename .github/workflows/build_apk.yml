name: Build ScamShield Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Configure Android SDK Location & Accept Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          cd android
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_output.txt

      - name: Print Error Summary If Failed
        if: failure()
        run: |
          echo "=================== ERROR LOG ==================="
          tail -n 120 gradle_output.txt

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScamShield-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
